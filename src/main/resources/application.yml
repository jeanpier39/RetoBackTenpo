spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/challenge
    username: postgres
    password: 1234
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
logging:
  level:
    org.hibernate.tool.hbm2ddl: TRACE
    org.hibernate.SQL: DEBUG
